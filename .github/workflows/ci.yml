name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [csms, control]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"  # same as the Docker images
      - name: Lint
        run: uvx ruff@0.14.6 check src tests
      - name: Test
        run: uv run --frozen pytest -q --cov=${{ matrix.service }} --cov-report=term

  image:
    # Builds each service image and imports the app inside it: catches a venv that doesn't match its interpreter.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [csms, control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t truckroll-${{ matrix.service }} ${{ matrix.service }}
      - name: Import inside the image
        run: docker run --rm --entrypoint python truckroll-${{ matrix.service }} -c "import ${{ matrix.service }}.main"
