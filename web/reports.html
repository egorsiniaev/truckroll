<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truckroll · reports</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reports.css">
</head>
<body class="reports-page">
  <header class="top">
    <div class="brand"><h1>Truckroll reports</h1>
      <p class="sub"><a href="/">Live map</a> <span class="muted">Post-mortems and NIS2/CRA drafts. Truckroll never sends anything to an&nbsp;authority.</span></p></div>
  </header>
  <main class="reports">
    <section class="list">
      <h4 class="rp-section">Daily NIS2 and&nbsp;CRA reports</h4>
      <ol id="daily-list"></ol>
      <h4 class="rp-section">Incidents</h4>
      <div class="filters"><label><input type="checkbox" id="only-reportable"> Only reportable</label></div>
      <ol id="incident-list"></ol>
    </section>
    <section class="detail" id="detail"><p class="hint">Pick a&nbsp;day or&nbsp;an&nbsp;incident.</p></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script>
    // If the page script can't load (e.g. a stale cached file), say so instead of "connecting…" forever.
    addEventListener("error", (e) => {
      const live = document.getElementById("live");
      if (live && /module|import|export|Syntax/i.test(String(e.message))) { live.className = "live err"; live.textContent = "page out of date: reload"; }
    });
  </script>
  <script type="module" src="js/reports.js"></script>
</body>
</html>
