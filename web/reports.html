<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truckroll · reports</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reports.css">
</head>
<body class="reports-page">
  <header class="top">
    <div class="brand"><h1>Truckroll reports</h1>
      <p class="sub"><a href="/">← Live map</a> <span class="muted">Post-mortems and NIS2/CRA drafts. Drafts only: Truckroll never sends anything to an&nbsp;authority.</span></p></div>
  </header>
  <main class="reports">
    <section class="list">
      <div class="filters"><label><input type="checkbox" id="only-reportable"> Only reportable</label></div>
      <ol id="incident-list"></ol>
    </section>
    <section class="detail" id="detail"><p class="hint">Pick an&nbsp;incident.</p></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/reports.js"></script>
</body>
</html>
