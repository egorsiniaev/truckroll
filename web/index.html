<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truckroll · live charging network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Truckroll</h1>
      <p class="sub">Live charging network <span id="live" class="live">connecting…</span></p>
    </div>
    <div class="kpis" id="kpis">
      <div class="kpi" data-kpi="availability"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="value" cx="22" cy="22" r="18"/></svg><div><b>–</b><span>Availability</span></div></div>
      <div class="kpi" data-kpi="online"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="value" cx="22" cy="22" r="18"/></svg><div><b>–</b><span>Stations online</span></div></div>
      <div class="kpi" data-kpi="charging"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="value" cx="22" cy="22" r="18"/></svg><div><b>–</b><span>Charging now</span></div></div>
      <div class="kpi" data-kpi="power"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="value" cx="22" cy="22" r="18"/></svg><div><b>–</b><span>Power vs grid caps</span></div></div>
      <div class="kpi" data-kpi="faulted"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="value" cx="22" cy="22" r="18"/></svg><div><b>–</b><span>Faulted</span></div></div>
    </div>
  </header>

  <main class="stage">
    <svg id="scene" viewBox="-780 -500 1560 960" role="img" aria-label="Isometric map of four charging sites"></svg>

    <section class="feed" aria-live="polite">
      <h2>Events</h2>
      <ol id="feed"><li class="muted">Waiting for&nbsp;the&nbsp;first update…</li></ol>
    </section>

    <section class="legend">
      <span><i class="dot available"></i>Available</span>
      <span><i class="dot preparing"></i>Preparing</span>
      <span><i class="dot charging"></i>Charging</span>
      <span><i class="dot faulted"></i>Faulted</span>
      <span><i class="dot offline"></i>Offline</span>
    </section>
  </main>

  <aside class="panel" id="panel">
    <nav class="tabs">
      <button data-tab="details" class="active">Details</button>
      <button data-tab="controls">Control panel</button>
    </nav>
    <div id="details" class="tab-body">
      <p class="hint">Click a&nbsp;site or&nbsp;a&nbsp;charger to&nbsp;see what it’s doing and&nbsp;to&nbsp;control&nbsp;it.</p>
    </div>
    <div id="controls" class="tab-body" hidden></div>
  </aside>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
