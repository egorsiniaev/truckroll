# Server overrides: docker compose -f compose.yaml -f compose.server.yaml up -d
# Only Caddy is reachable from outside; everything else stays on the Docker network or localhost.
services:
  caddy:
    image: caddy:2
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRUCKROLL_HOST: truckroll.siniaev.dev
    volumes:
      # The folder, not the file: rsync replaces files, and a single-file mount would keep the old one.
      - ./deploy:/etc/caddy/conf:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [control]
    restart: unless-stopped

  control:
    environment:
      GRAFANA_URL: /grafana/d/truckroll-fleet

  grafana:
    environment:
      # Public at /grafana, read-only for everyone.
      GF_SERVER_ROOT_URL: https://truckroll.siniaev.dev/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"

  csms:
    # No public OCPP port yet; the desk charger will come in through Caddy over TLS.
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
