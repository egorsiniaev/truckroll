# Server overrides: docker compose -f compose.yaml -f compose.server.yaml up -d
# Only Caddy is reachable from outside; everything else stays on the Docker network or localhost.
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRUCKROLL_HOST: truckroll.siniaev.dev
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Login hash, created on the server only (never in git). Caddy refuses to start without it.
      - /etc/truckroll:/etc/caddy/secrets:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [control]
    restart: unless-stopped

  control:
    environment:
      GRAFANA_URL: /grafana/d/truckroll-fleet

  grafana:
    environment:
      # Served at /grafana behind the site login; no admin rights for anonymous users on the server.
      GF_SERVER_ROOT_URL: https://truckroll.siniaev.dev/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_BASIC_ENABLED: "false"

  csms:
    # No public OCPP port yet; the desk charger will come in through Caddy over TLS.
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
